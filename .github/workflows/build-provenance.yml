name: Build and attest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      published_at:
        description: 'Production publication time in ISO 8601 (UTC)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check source
        run: npm run check
      - name: Build website
        env:
          PUBLISHED_AT: ${{ inputs.published_at }}
          ATTESTATION_URL: ${{ github.event_name != 'pull_request' && format('https://github.com/{0}/attestations', github.repository) || '' }}
        run: npm run build
      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: shinp-studio-site
          path: dist
          if-no-files-found: error
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/**
